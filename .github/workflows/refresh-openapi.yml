name: Refresh OpenAPI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/actions-permissions
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Refresh generated OpenAPI files
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///./openapi-generation.db
          JWT_SECRET_KEY: ${{ github.sha }}${{ github.sha }}
          CONFIG_ENCRYPTION_KEY: ${{ github.sha }}${{ github.sha }}
          PROXMOX_BASE_URL: https://127.0.0.1:8006/api2/json
          PROXMOX_TOKEN_ID: ci@pve!labgoblin
          PROXMOX_TOKEN_SECRET: ${{ github.sha }}
          PROXMOX_VERIFY_SSL: 'true'
          WORKER_SCHEDULER_ENABLED: 'false'
        run: |
          python scripts/export_openapi.py frontend/openapi.json
          cd frontend
          npx --yes openapi-typescript@7.13.0 openapi.json -o src/generated/api-schema.d.ts
      - name: Validate generated diff
        run: git diff --check
      - name: Commit generated contract
        run: |
          if git diff --quiet -- frontend/openapi.json frontend/src/generated/api-schema.d.ts; then
            echo 'Generated contract already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/openapi.json frontend/src/generated/api-schema.d.ts
          git commit -m 'chore: refresh LabGoblin OpenAPI contract'
          git push origin HEAD:test/actions-permissions
