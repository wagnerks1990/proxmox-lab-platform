name: Maintenance Fix

on:
  push:
    branches:
      - test/actions-permissions

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/actions-permissions
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install formatter
        run: pip install ruff==0.12.12
      - name: Normalize remaining LabGoblin identifiers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/models/models.py')
          text = path.read_text()
          old = 'default="proxmox-lab-runner"'
          if old not in text:
              raise SystemExit('expected legacy runner default not found')
          path.write_text(text.replace(old, 'default="labgoblin-runner"', 1))
          PY
      - name: Format Python sources
        run: ruff format deploy/updater_agent.py scripts/check_branding.py backend/app/models/models.py
      - name: Regenerate npm lock metadata
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Re-enable lockfile branding validation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/check_branding.py')
          text = path.read_text()
          block = '''# package-lock.json is generated by npm. Its root package metadata must be updated\n# by npm regeneration rather than hand-editing through repository automation.\nGENERATED_FILES = {Path("frontend/package-lock.json")}\n\n\n'''
          if block not in text:
              raise SystemExit('expected generated-file exception not found')
          text = text.replace(block, '')
          text = text.replace('        if rel in GENERATED_FILES or any(part in SKIP_DIRS for part in rel.parts):', '        if any(part in SKIP_DIRS for part in rel.parts):')
          path.write_text(text)
          PY
          ruff format scripts/check_branding.py
      - name: Validate normalization
        run: |
          python scripts/check_branding.py
          ruff format --check backend/app backend/tests deploy scripts tests
          git diff --check
      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/models/models.py deploy/updater_agent.py scripts/check_branding.py frontend/package-lock.json
          git commit -m 'fix: normalize remaining LabGoblin identifiers and formatting'
          git push origin HEAD:test/actions-permissions
