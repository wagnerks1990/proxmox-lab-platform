name: LabGoblin Branding

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  branding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject retired application-owned identifiers
        run: python scripts/check_branding.py
