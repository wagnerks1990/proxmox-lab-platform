name: proxmox-lab-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proxmox_lab}
      POSTGRES_USER: ${POSTGRES_USER:-proxmox_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  api:
    build: ./backend
    restart: unless-stopped
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-proxmox_lab}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-proxmox_lab}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY is required}
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:?BOOTSTRAP_ADMIN_TOKEN is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PROXMOX_BASE_URL: ${PROXMOX_BASE_URL:-https://127.0.0.1:8006/api2/json}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-bootstrap@pve!replace}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-replace-in-gui}
      PROXMOX_VERIFY_SSL: ${PROXMOX_VERIFY_SSL:-true}
      UPDATER_TOKEN: ${UPDATER_TOKEN:?UPDATER_TOKEN is required}
      UPDATER_REPOSITORY: ${UPDATER_REPOSITORY:-https://github.com/wagnerks1990/proxmox-lab-platform.git}
      UPDATER_ALLOW_AUTOMATIC: ${UPDATER_ALLOW_AUTOMATIC:-false}
      UPDATER_REQUIRE_SIGNED_COMMITS: ${UPDATER_REQUIRE_SIGNED_COMMITS:-false}
      REDIS_URL: redis://redis:6379/0
      REPLAY_STORE_BACKEND: redis
      WORKER_LOCK_BACKEND: redis
      WORKER_SCHEDULER_ENABLED: "true"
      RUN_MIGRATIONS: "true"
    volumes:
      - /var/lib/proxmox-lab-platform/updater:/var/lib/proxmox-lab-platform/updater
    group_add:
      - "${UPDATER_GID:?UPDATER_GID is required}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
