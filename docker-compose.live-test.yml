services:
  mock-proxmox:
    image: python:3.12-slim
    command:
      - sh
      - -ec
      - |
        apt-get update >/dev/null
        apt-get install -y --no-install-recommends openssl >/dev/null
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -subj '/CN=mock-proxmox' \
          -addext 'subjectAltName=DNS:mock-proxmox' \
          -keyout /tmp/mock-proxmox.key -out /tmp/mock-proxmox.crt >/dev/null 2>&1
        python /live/mock_proxmox.py --host 0.0.0.0 --port 8006 \
          --certfile /tmp/mock-proxmox.crt --keyfile /tmp/mock-proxmox.key
    volumes:
      - ./tests/live:/live:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8006/api2/json/version', context=ssl._create_unverified_context(), timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    environment:
      PROXMOX_BASE_URL: https://mock-proxmox:8006/api2/json
      PROXMOX_TOKEN_ID: live-test@pve!platform
      PROXMOX_TOKEN_SECRET: live-test-only
      PROXMOX_VERIFY_SSL: "false"
      PROXMOX_ALLOW_INSECURE_TLS: "true"
      OPERATION_POLL_INTERVAL_SECONDS: "1"
    depends_on:
      mock-proxmox:
        condition: service_healthy
